<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let storyIndex;

        function ClickAnswer() {

            let answer = document.getElementById("userAnswer").value;
            let prompt;
            if (storyIndex == undefined) {
                storyIndex = 0
            }

            switch (storyIndex) {
                case 0:
                    switch (answer) {
                        case "left":
                            prompt = "you went left";
                            storyIndex = 1;
                            break;
                        case "right":
                            prompt = "you went right";
                            storyIndex = 2;
                            break;
                        default:
                            prompt = "idk bro";
                            break;
                    }
                    break;
                case 1:
                    switch (answer) {
                        case "left":
                            prompt = "you went left";
                            storyIndex = 1;
                            break;
                        case "right":
                            prompt = "you went right, do u wanna jump in the hole?";
                            storyIndex = 2;
                            break;
                        default:
                            prompt = "idk bro";
                            break;
                    }
                    break;
                case 2:
                    switch (answer) {
                        case "yes":
                            prompt = "FUCKKKK";
                            storyIndex = 1;
                            break;
                        case "no":
                            prompt = "naa bro";
                            storyIndex = 2;
                            break;
                        default:
                            prompt = "idk bro";
                            break;
                    }
                    break;
            }

            document.getElementById("logArea").textContent = prompt;


        }
    </script>
</head>

<body>

    <main>
        <p id="logArea">
            ---
        </p>


    </main>
    <footer>
        <input type="text" id="userAnswer">
        <input type="submit" onclick="ClickAnswer()">
    </footer>


</body>


</html>
